name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent Clipstack.app Clipstack.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Clipstack
          path: build/Clipstack.zip
      - name: Check the Xcode project (signed build) compiles
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Clipstack.xcodeproj -scheme Clipstack -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Check the direct download build (with Sparkle) compiles
        run: |
          xcodebuild -project Clipstack.xcodeproj -scheme ClipstackDirect -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
