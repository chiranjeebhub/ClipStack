name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent Clipboard.app Clipboard.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Clipboard
          path: build/Clipboard.zip
